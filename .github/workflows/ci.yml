name: CI Pipeline & Pruebas Unitarias

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Ejecutar Pruebas y Validar Pipeline
    runs-on: ubuntu-latest

    steps:
    - name: Descargar repositorio
      uses: actions/checkout@v4

    - name: Configurar Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install requests pytest python-dotenv

    - name: Ejecutar pruebas unitarias con pytest
      run: |
        pytest -v test_pipeline.py

    - name: Ejecutar pipeline de integración completo (main.py)
      run: |
        python main.py

    - name: Verificar generación de entregables obligatorios
      run: |
        test -f reporte_solicitudes.csv || exit 1
        test -f talento_andino.db || exit 1
        test -f resultados_sql/consultas_mision1.json || exit 1
        echo "Todos los artefactos requeridos fueron generados exitosamente."

